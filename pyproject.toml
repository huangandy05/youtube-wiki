[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-wiki"
version = "0.1.0"
description = "A local YouTube channel transcript collector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "streamlit>=1.45,<2",
  "youtube-transcript-api>=1.1,<2",
  "yt-dlp>=2025.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
